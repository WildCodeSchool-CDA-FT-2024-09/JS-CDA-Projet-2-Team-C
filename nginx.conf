http {
    server{
  
    listen 80;
    
    location /coreapi{
      proxy_pass http://coreapi:4000;
      proxy_http_version 1.1;
      access_log off;
    }
    
    location / {
      proxy_pass http://client:5173;
      proxy_http_version 1.1;
      proxy_set_header Connection $http_connection;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_cache_bypass $http_upgrade;
    }

    # The extra slashes ensures the path is not appended to the proxy_pass URL.
    # more info can be found in here : https://nginx.org/en/docs/http/ngx_http_core_module.html#location
    location /upload/{
      proxy_pass http://upload:3210/;
      proxy_http_version 1.1;
      access_log off;
    }
    
  }
}
events{
#nothing here
}
